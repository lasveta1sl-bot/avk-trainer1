 lines:[["ОЛЯ","Настя, привет! Что это у тебя?"],["НАСТЯ","Это [билеты] в цирк. Хочу [пригласить] тебя на завтрашнее [представление]."],["ОЛЯ","Спасибо! С удовольствием. А на чём мы поедем? Ведь [цирк] очень далеко от нашего университета."],["НАСТЯ","Давай поедем на [автобусе]. Это быстро, [удобно] и недорого. Многие люди пользуются этим видом [транспорта]."],["ОЛЯ","Вот именно! Завтра [выходной] и в автобусе будет слишком много людей."],["НАСТЯ","Ну, тогда давай поедем на [трамвае]. Трамвай идёт медленнее автобуса, но добираться на нём тоже удобно и недорого."],["ОЛЯ","Как же удобно? Если ехать на трамвае, надо делать [пересадку]. От нашего университета до площади, где находится цирк, нет прямого [сообщения], если ехать на трамвае."],["НАСТЯ","Ах, да! Я совсем забыла. Что же делать? Может, возьмём [такси]?"],["ОЛЯ","Ты [миллионер]? Ездить на такси, конечно, быстро и комфортно, но слишком [дорого]!"],["НАСТЯ","Какой вид транспорта выбрать?"]]},

 lines:[["МОЛОДОЙ ЧЕЛОВЕК","Скажите, пожалуйста, как [пройти] на почту?"],["ТАКСИСТ","Идите [прямо], на перекрёстке увидите большое здание…"],["МОЛОДОЙ ЧЕЛОВЕК","Это и есть [почта]? Спасибо!"],["ТАКСИСТ","Нет. Я же говорю вам: идите прямо, на перекрёстке увидите большое здание, это [банк]. Около банка поверните [направо] и…"],["МОЛОДОЙ ЧЕЛОВЕК","Там будет почта!"],["ТАКСИСТ","Ещё нет. Около банка поверните направо и идите прямо до центрального [парка]. [Пройдите] через парк и сразу…"],["МОЛОДОЙ ЧЕЛОВЕК","И сразу [увижу] почту!"],["ТАКСИСТ","Молодой человек, куда вы так [торопитесь]? Дойдёте до центрального парка, пройдёте через парк и сразу увидите большой книжный [магазин]. Напротив магазина…"],["МОЛОДОЙ ЧЕЛОВЕК","Почта!"],["ТАКСИСТ","Напротив магазина автобусная [остановка]. Вам надо [сесть] на автобус номер…"],["МОЛОДОЙ ЧЕЛОВЕК","Пожалуйста, [довезите] меня до почты! Мне надо срочно [отправить] это письмо."],["ТАКСИСТ","Пожалуйста! Я вас быстро довезу!"]]},

{title:"Текст 1. Извините, вы не подскажете, где здесь…?", words:291,
 text:"Москва! Сколько людей мечтает приехать сюда! Но ещё больше людей мечтает здесь жить! Каждый, кто приезжает в Москву, влюбляется в этот город. Ему хочется верить, что он живёт, жил и будет жить именно здесь, даже если он приехал в Москву только на неделю. Я приехал в Москву три дня назад. Всё в этом городе мне очень нравилось! Я ехал в метро, и мне это очень нравилось! Я гулял по Красной площади и был на экскурсии в Кремле, и мне это тоже очень нравилось! Я просто смотрел на старинные и современные дома на улицах города, и мне это нравилось не меньше! Но тут случилось так, что я потерялся. И мне это не нравилось. Хорошо, что я помнил название гостиницы, в которой жил — гостиница «Московская». — Простите, — обратился я к прохожему на улице. — Вы не подскажете, как мне доехать до гостиницы «Московская»? — Садитесь на метро. И поезжайте в центр города. Гостиница «Московская» находится в центре, — сказал он. Я поблагодарил этого доброго молодого человека, но засомневался, поэтому решил спросить у другого прохожего. — Извините, вы не скажете, как добраться до гостиницы «Московская»? — Сейчас вам нужно сесть на автобус номер тридцать пять и проехать четыре остановки. Гостиница во дворе дома. Спросите у прохожих. — Спасибо, — сказал я, — и поспешил на остановку. Но тут заметил, что автобус номер тридцать пять идёт не в центр, а в южный микрорайон. Тогда я решил спросить у человека, который стоял на остановке. Он сказал, что если я пойду прямо, а потом поверну направо, я сразу же увижу гостиницу «Московская». Я пошёл прямо и повернул направо. Там действительно была гостиница. Но не «Московская», а «Москва». А рядом стоял газетный киоск. Тогда я подошёл к газетному киоску и купил карту Москвы. Уж она-то точно скажет, где гостиница «Московская».",

{title:"Ван Ли едет на Красную площадь", words:230,
 text:"Ван Ли приехал в Москву учиться. Он живёт в общежитии на окраине города, в северном микрорайоне. В первое воскресенье Ван Ли решил поехать на Красную площадь. Он вышел из общежития и дошёл до автобусной остановки. Автобус номер двенадцать подошёл через пять минут. Ван Ли проехал три остановки и вышел около станции метро. Он увидел большую красную букву «М» и понял: это вход в метро. В метро было много людей, потому что был выходной. Ван Ли долго смотрел на схему метро, но ничего не понял: станций было слишком много. Тогда он обратился к девушке, которая стояла рядом: «Извините, вы не подскажете, как доехать до Красной площади?» Девушка сказала: «Вам надо доехать до станции «Охотный ряд». Это семь остановок, без пересадки». Ван Ли поблагодарил девушку и сел в поезд. Через двадцать минут он вышел на станции «Охотный ряд», поднялся наверх и увидел большое красивое здание с вывеской «ГУМ». Ван Ли подумал, что это университет, но прохожий объяснил ему, что ГУМ — это Государственный универсальный магазин, самый известный магазин Москвы. Напротив магазина была Красная площадь и Кремль. Ван Ли сфотографировал Кремль и отправил фотографию родителям в Сюйчжоу. Вечером он вернулся в общежитие на метро и на автобусе. Он очень устал, но был счастлив: теперь он знает, что язык до Киева доведёт.",

{title:"Мой район (задание 5)", words:110,

const WORD_AUDIO_RE = new RegExp('(' + Object.keys(WORD_AUDIO).join('|') + ')', 'gi');
function speakPlain(text, cb){
  if(!('speechSynthesis' in window)){ cb&&cb(); return; }
  const u=new SpeechSynthesisUtterance(forSpeech(text)); u.lang='ru-RU'; if(voice) u.voice=voice; u.rate=rate;
  u.onend=()=>{ if(!stopped) cb&&cb(); }; u.onerror=()=>{ if(!stopped) cb&&cb(); };
  speechSynthesis.speak(u);
}
function playAudioClip(key, cb){
  const src = WORD_AUDIO[key];
  if(!src){ cb&&cb(); return; }
  const a = new Audio(src); a.playbackRate = rate; currentAudio = a;
  a.onended=()=>{ if(!stopped) cb&&cb(); }; a.onerror=()=>{ if(!stopped) cb&&cb(); };
  a.play().catch(()=>{ if(!stopped) cb&&cb(); });
}
function speak(text, cb){
  if(!('speechSynthesis' in window)){ toast('Синтез речи недоступен — читайте текст.'); cb&&cb(); return; }
  stopped = false;
  speechSynthesis.cancel();
  if(currentAudio){ try{currentAudio.pause();}catch(e){} currentAudio=null; }
  const steps = String(text||'').split(WORD_AUDIO_RE).filter(p=>p!==undefined && p!=='');
  let i=0;
  const next=()=>{
    if(stopped) return;
    if(i>=steps.length){ cb&&cb(); return; }
    const part = steps[i++]; const key = part.toLowerCase();
    if(Object.prototype.hasOwnProperty.call(WORD_AUDIO, key)){
      playAudioClip(key, ()=>{ if(stopped) return; setTimeout(()=>{ if(!stopped) next(); }, 120); });
    } else if(part.trim()){
      speakPlain(part, ()=>{ if(stopped) return; setTimeout(()=>{ if(!stopped) next(); }, 60); });
    } else { next(); }
  };
  next();
}
function speakSeq(list, i=0, cb){ if(stopped) return; if(i>=list.length){cb&&cb();return;} speak(list[i], ()=>{ if(stopped) return; setTimeout(()=>{ if(!stopped) speakSeq(list,i+1,cb); }, 350); }); }
function splitSentences(text){ return (text.match(/[^.!?…]+[.!?…]*["»]?\s*/g)||[text]).map(s=>s.trim()).filter(Boolean); }
function stop(){ stopped = true; if('speechSynthesis' in window) speechSynthesis.cancel(); if(currentAudio){ try{currentAudio.pause();}catch(e){} currentAudio=null; } }
function toast(m){ const t=document.createElement('div'); t.textContent=m; t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9'; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }

function saveProg(mod, correct, total){ const p=prog[mod]||{c:0,t:0,best:0}; p.c+=correct; p.t+=total; const pct=Math.round(100*correct/Math.max(total,1)); p.best=Math.max(p.best,pct); p.last=pct; prog[mod]=p; store.set('prog',prog); }

// ---------- 6. Карта
const DIRS={N:[-1,0],S:[1,0],E:[0,1],W:[0,-1]};
const TURN={N:{right:'E',left:'W'},E:{right:'S',left:'N'},S:{right:'W',left:'E'},W:{right:'N',left:'S'}};
const DIRNAME={N:'на север',S:'на юг',E:'на восток',W:'на запад'};
function cellName(r,c){ return DATA.map.cells[r][c]; }
function cellGen(r,c){ return DATA.map.gen[r][c]; }
function cellDat(r,c){ return DATA.map.dat[r][c]; }
function genRoute(){ // от случайной клетки, 3-5 шагов по сетке
  for(let tries=0;tries<200;tries++){
    let r=Math.floor(Math.random()*5), c=Math.floor(Math.random()*5), dir='NSEW'[Math.floor(Math.random()*4)];
    const start=[r,c]; const steps=[]; const n=3+Math.floor(Math.random()*3); let okk=true; const visited=new Set([r+','+c]);
    for(let s=0;s<n;s++){
      const act = s===0 ? 'straight' : ['straight','left','right','straight'][Math.floor(Math.random()*4)];
      if(act!=='straight') dir=TURN[dir][act];
      const [dr,dc]=DIRS[dir]; const nr=r+dr, nc=c+dc; if(nr<0||nr>4||nc<0||nc>4||visited.has(nr+','+nc)){okk=false;break;}
      const passedGen=cellGen(r,c);
      let phrase = s===0 ? `Выйдите из «${passedGen}» и идите прямо` : (act==='straight'?`Идите прямо дальше`:(act==='left'?`Поверните налево`:`Поверните направо`));
      r=nr;c=nc; visited.add(r+','+c);
      phrase += `, пройдите мимо «${cellGen(r,c)}»`;
      steps.push({text:phrase, dir, act});
    }
    if(!okk||steps.length<3) continue;
    // финальная фраза: цель = последняя клетка
    const last=steps[steps.length-1]; last.text = last.text.replace(/, пройдите мимо «[^»]+»$/, `. Это и есть то место, куда вам надо.`);
    return {start, end:[r,c], steps};
  }
}

  let i=0, correct=0, N=6;
  const render=()=>{

    app.innerHTML=`<div class="card">${head('map',`<span class="prog">${i+1}/${N}</span>`)}<p>Вы стоите в клетке <b>«${esc(cellName(...R.start))}»</b> (жёлтая). Послушайте маршрут и нажмите на место, куда вы пришли. Стороны: север — вверх.</p>
    <div class="row"><button class="pri big" id="pl">🔊 Слушать маршрут</button>${speedBtn()}<button id="txtb">Показать текст</button></div><div id="scr" hidden class="sent" style="font-size:15px">${script.map(s=>esc(s)).join('<br>')}</div>${drawMap(R.start)}<div id="fb"></div></div>`;
    $('#pl').onclick=()=>speakSeq(script); $('#txtb').onclick=()=>$('#scr').hidden=false;
    app.querySelectorAll('.cell').forEach(el=>el.onclick=()=>{ const r=+el.dataset.r,c=+el.dataset.c; const ok=r===R.end[0]&&c===R.end[1]; if(ok)correct++; el.classList.add(ok?'ok':'bad'); app.querySelector(`.cell[data-r="${R.end[0]}"][data-c="${R.end[1]}"]`).classList.add('ok'); app.querySelectorAll('.cell').forEach(x=>x.onclick=null);
      $('#scr').hidden=false; $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Верно! Вы пришли к «'+esc(cellDat(r,c))+'».':'Нет, вы пришли к «'+esc(cellDat(r,c))+'», а надо было к «'+esc(cellDat(...R.end))+'». Проследите маршрут по тексту.'}</div><div class="row"><button class="pri" id="nx">Дальше →</button></div>`; $('#nx').onclick=()=>{i++;render();}; });
  };
  render();
}
function modMapB(){
  const R=genRoute(); let pos=[...R.start], dir=null, steps=[], trace=[];
  const render=()=>{
    app.innerHTML=`<div class="card">${head('map')}<p>Вы у «<b>${esc(cellName(...R.start))}</b>» (жёлтая клетка). Объясните дорогу до «<b>${esc(cellGen(...R.end))}</b>» (синяя рамка): соберите маршрут из фраз. Первый шаг — куда идти; дальше можно только «прямо», «налево», «направо».</p>
    ${drawMap(pos,R.end)}
    <div class="steps">${dir===null?['N','S','E','W'].map(d=>`<button data-d="${d}">Идите прямо ${DIRNAME[d]}</button>`).join(''):`<button data-a="straight">Идите прямо (ещё одну клетку)</button><button data-a="left">Поверните налево</button><button data-a="right">Поверните направо</button>`}</div>
    <div class="sent" style="font-size:15px">${steps.length?steps.map((s,i)=>`${i+1}. ${esc(s)}`).join('<br>'):'<span class="muted">Ваш маршрут появится здесь. Произносите каждую фразу вслух!</span>'}</div>
    <div class="row"><button class="pri" id="say">🔊 Озвучить мой маршрут</button><button id="reset">Сначала</button><button onclick="modMapMenu()">← Режимы</button></div><div id="fb"></div></div>`;
    const move=(d,phrase)=>{ const [dr,dc]=DIRS[d]; const nr=pos[0]+dr,nc=pos[1]+dc; if(nr<0||nr>4||nc<0||nc>4){toast('Так вы выйдете за границу кампуса');return;} pos=[nr,nc]; dir=d; steps.push(`${phrase}, пройдите мимо «${cellGen(nr,nc)}»`);
      if(nr===R.end[0]&&nc===R.end[1]){ render(); saveProg('map',1,1); $('#fb').innerHTML=`<div class="fb ok">Вы дошли до цели за ${steps.length} шагов! Теперь скажите весь маршрут вслух без подсказки: «Чтобы добраться до «${esc(cellGen(...R.end))}», вам надо…»</div>`; return; } if(steps.length>=8){ render(); $('#fb').innerHTML=`<div class="fb bad">Слишком длинный маршрут. Нажмите «Сначала» и попробуйте короче.</div>`; return;} render(); };
    app.querySelectorAll('.steps button[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d,`Выйдите из «${cellGen(...R.start)}» и идите прямо`));
    app.querySelectorAll('.steps button[data-a]').forEach(b=>b.onclick=()=>{ const a=b.dataset.a; const d=a==='straight'?dir:TURN[dir][a]; move(d, a==='straight'?'Идите прямо дальше':(a==='left'?'Поверните налево':'Поверните направо')); });
    $('#say').onclick=()=>{ if(!steps.length){ toast('Сначала постройте маршрут — нажмите на одну из кнопок направления ниже'); return; } speakSeq(steps); }; $('#reset').onclick=()=>{pos=[...R.start];dir=null;steps=[];render();};
  };
  render();
}

// ---------- 7. Культура
function modCult(){
  let items=shuffle(DATA.culture), i=0, correct=0;
  const render=()=>{
    if(i>=items.length){ saveProg('cult',correct,items.length); return finish('cult',correct,items.length,modCult); }
    const it=items[i];
    app.innerHTML=`<div class="card">${head('cult',`<span class="prog">${i+1}/${items.length}</span>`)}<div class="sent">${esc(it[0])}</div>
    <div class="opts">${it[1].map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
    app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ const ok=+b.dataset.k===it[2]; if(ok)correct++; app.querySelectorAll('.opts button').forEach(x=>{x.disabled=true; if(+x.dataset.k===it[2])x.classList.add('ok');}); if(!ok)b.classList.add('bad');
      $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Верно!':'Неверно.'} ${esc(it[3]||'')}</div><div class="row"><button class="pri" id="nx">Дальше →</button></div>`; $('#nx').onclick=()=>{i++;render();}; speak(it[1][it[2]]); });
  };
  render();
}

// ---------- финиш / отчёт / преподаватель
function finish(mod, c, t, again, unit='правильных ответов'){
  const pct=Math.round(100*c/Math.max(t,1));
  app.innerHTML=`<div class="card">${head(mod)}<div class="stats"><div class="stat"><b>${pct}%</b>результат</div><div class="stat"><b>${c}/${t}</b>${unit}</div><div class="stat"><b>${prog[mod]?.best||pct}%</b>лучший</div></div>
  <div class="fb ${pct>=80?'ok':'bad'}" style="margin-top:12px">${pct>=90?'Отлично! Это задание экзамена вы сдадите.':pct>=70?'Хорошо. Ещё один прогон — и будет отлично.':'Стоит повторить: послушайте диалоги/слова ещё раз и вернитесь.'}</div>
  <div class="row"><button class="pri" onclick="(${again.name})()">Ещё раз</button><button onclick="home()">Меню</button><button onclick="report()">Карта готовности</button></div></div>`;
}
function report(){
  const name=$('#uname').value||'—', team=$('#uteam').value||'—';
  const rows=MODULES.map(m=>{const p=prog[m.id]; return `<tr><td>${m.n}. ${m.t}</td><td>${m.ex}</td><td>${p?p.best+'%':'—'}</td><td>${p?p.last+'%':'—'}</td></tr>`;}).join('');
  const txt=`Тренажёр «В городе» · ${name} · команда ${team} · `+MODULES.map(m=>`${m.n}:${prog[m.id]?prog[m.id].best+'%':'—'}`).join(' ');
  app.innerHTML=`<div class="card"><div class="top"><button onclick="home()">← Меню</button><h2>Карта готовности к экзамену</h2></div><p>${esc(name)} · команда ${esc(team)} · ${new Date().toLocaleDateString('ru-RU')}</p>
  <table style="width:100%;border-collapse:collapse;font-size:15px"><tr style="background:#eef2f8"><th style="text-align:left;padding:6px">Модуль</th><th style="text-align:left;padding:6px">Экзамен</th><th style="padding:6px">Лучший</th><th style="padding:6px">Последний</th></tr>${rows}</table>
  <p class="muted" style="margin-top:10px">Сделайте скриншот этой страницы и отправьте преподавателю в WeChat, или скопируйте строку:</p><div class="sent" style="font-size:14px">${esc(txt)}</div>
  <div class="row"><button onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(txt)}).then(()=>toast('Скопировано'))">Копировать</button><button onclick="if(confirm('Сбросить все результаты?')){prog={};store.set('prog',prog);home();}">Сбросить результаты</button></div></div>`;
}
function teacherMode(){
  const hearRows=DATA.hear.map((h,i)=>`<tr><td>${i+1}</td><td>${esc(h[0])}</td><td><button onclick="speak(${JSON.stringify(h[1])})">🔊</button> ${esc(h[1])}</td><td>${h[2]===null?'√':'× '+esc(h[2])}</td></tr>`).join('');
  const paraRows=DATA.para.map((p,i)=>`<tr><td>${i+1}</td><td><button onclick="speak(${JSON.stringify(p[0])})">🔊</button> ${esc(p[0])}</td><td>${'АБВ'[p[2]]}</td></tr>`).join('');
  app.innerHTML=`<div class="card"><div class="top"><button onclick="home()">← Меню</button><h2>Режим преподавателя: озвучивание скриптов на занятии</h2>${speedBtn()}<button onclick="stop()">⏹ Стоп</button></div>
  <p class="muted">Нажмите 🔊 — фрагмент прозвучит на аудиторию. Тексты: ${DATA.texts.map((t,k)=>`<button onclick="speak(${JSON.stringify(t.text)})">🔊 ${esc(t.title)}</button>`).join(' ')} Диалоги: ${DATA.dialogs.map((d,k)=>`<button onclick="speakSeq(${JSON.stringify(d.lines.map(l=>l[1].replace(/[\\[\\]]/g,'')))})">🔊 ${esc(d.title)}</button>`).join(' ')}</p>
  <h3>Задание 1 — предложения</h3><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="background:#eef2f8"><th>№</th><th style="text-align:left">Написано</th><th style="text-align:left">Звучит</th><th>Ключ</th></tr>${hearRows}</table>
  <h3>Задание 2 — сообщения</h3><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="background:#eef2f8"><th>№</th><th style="text-align:left">Звучит</th><th>Ключ</th></tr>${paraRows}</table></div>`;
}
$('#uname').value=store.get('name',''); $('#uteam').value=store.get('team','');
$('#uname').oninput=e=>store.set('name',e.target.value); $('#uteam').oninput=e=>store.set('team',e.target.value);
home();
</script>
