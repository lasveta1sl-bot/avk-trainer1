<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лестница: перефразируй</title><style>
:root{--b:#2f5796;--bg:#f4f6fa;--ink:#1f2937;--line:#d7dde7;--ok:#16803d;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{padding:14px 20px;background:var(--b);color:#fff;display:flex;align-items:center}header h1{font-size:20px;margin:0}header a{margin-left:auto;background:#fff;color:#111;border-radius:9px;padding:9px 14px;text-decoration:none}main{max-width:980px;margin:auto;padding:18px}.card,.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.tile{cursor:pointer}.tile:hover{border-color:var(--b)}h2{margin:0 0 10px}.badge{display:inline-block;background:#eaf1fc;color:var(--b);border-radius:16px;padding:2px 8px;font-size:13px}.muted{color:#687386}.bar{height:7px;background:#e5e7eb;border-radius:5px;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}.top,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top .score{margin-left:auto;color:#687386}.dots{margin-left:auto;display:flex;gap:6px}.dots i{display:block;width:13px;height:13px;border-radius:50%;background:#e7dfd2}.dots i.now{background:var(--b)}.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}button.pri{background:var(--b);color:#fff;border-color:var(--b)}button.ok{border-color:var(--ok);background:#dcfce7}button.bad{border-color:var(--bad);background:#fee2e2}.opts{display:grid;gap:8px;margin:16px 0}.opts button{text-align:left}.feedback{padding:12px;border-radius:9px;margin-top:12px}.feedback.ok{background:#dcfce7;color:var(--ok)}.feedback.bad{background:#fee2e2;color:var(--bad)}input{font:inherit;width:min(100%,540px);padding:11px;border-radius:8px;border:1px solid var(--line)}.flow{padding:14px;background:#f8fafc;border-radius:10px;text-align:center;font-size:19px}.hidden{display:none}</style></head><body>
<header><div><h1>Лестница: перефразируй</h1><div>Экзаменационное задание 2 · 同义句选择训练</div></div><a href="./index.html" target="_top">← К тренажёру</a></header><main id="app"><div class="card"><h2>Лестница загружается…</h2></div></main>
<script>
const app=document.getElementById('app');
const items=[
['Скажите, пожалуйста, как добраться до вокзала?','вокзала','до вокзала','До вокзала.','Человек спрашивает дорогу до вокзала.','Как доехать до вокзала?'],
['Ездить на такси быстро и комфортно, но слишком дорого.','дорого','слишком дорого','Слишком дорого.','Такси удобно, но стоит очень дорого.','Ехать на такси удобно, но дорого.'],
['От университета до цирка нет прямого сообщения.','сообщения','нет прямого сообщения','Нет прямого сообщения.','До цирка нужно ехать с пересадкой.','До цирка надо ехать с пересадкой.'],
['В час пик лучше всего ездить на метро.','пик','в час пик','В час пик.','Утром и вечером удобнее метро.','Утром и вечером удобнее ехать на метро.'],
['Гостиница новая, о ней мало кто знает.','мало','мало кто знает','Мало кто знает.','Гостиница недавно появилась и пока не популярна.','Гостиницу недавно построили, и её знают немногие.'],
['Давай поедем на автобусе: это быстро и недорого.','автобусе','быстро и недорого','На автобусе.','Говорящий предлагает ехать автобусом.','Я предлагаю ехать автобусом, потому что это быстро и дёшево.'],
['Завтра выходной, и в автобусе будет слишком много людей.','выходной','слишком много людей','Слишком много людей.','Завтра в автобусе будет тесно.','Завтра в автобусе будет тесно, потому что выходной.'],
['Трамвай идёт медленнее автобуса.','медленнее','медленнее автобуса','Медленнее автобуса.','Автобус едет быстрее трамвая.','Автобус едет быстрее трамвая.'],
['Многие люди пользуются этим видом транспорта.','транспорта','многие люди пользуются','Многие люди пользуются.','Этот транспорт популярен.','Этот вид транспорта популярный.'],
['Ты миллионер?','миллионер','ты миллионер','Миллионер.','Говорящий шутит о больших деньгах.','У тебя много денег, чтобы ездить на такси?'],
['Извините, вы не подскажете, где здесь почта?','почта','где здесь почта','Как пройти на почту?','Человек спрашивает, как пройти на почту.','Скажите, пожалуйста, как пройти на почту?'],
['Садитесь на метро и поезжайте в центр.','метро','поезжайте в центр','Поезжайте в центр.','До центра нужно ехать на метро.','До центра нужно ехать на метро.'],
['Я приехал в Москву три дня назад.','три','три дня назад','Три дня назад.','Человек приехал недавно.','Я в Москве совсем недавно.'],
['Гостиница находится во дворе дома.','дворе','во дворе дома','Во дворе дома.','Гостиницу не видно с улицы: она внутри двора.','Гостиницу не видно с улицы, она внутри двора.'],
['Каждый, кто приезжает в Москву, влюбляется в этот город.','влюбляется','влюбляется в этот город','Влюбляется в этот город.','Москва нравится всем, кто туда приезжает.','Москва нравится всем, кто в неё приезжает.']
];
const titles=['Слышу опорное слово','Слышу смысловую группу','Записываю услышанную смысловую опору','Понимаю прямой смысл','Узнаю перефраз одной части','Выбираю фразу с тем же смыслом','Ловлю смысловую ловушку','Экзаменационный формат'];
let best={};try{best=JSON.parse(localStorage.getItem('avk_ladder2_simple')||'{}')}catch(e){};
function save(){try{localStorage.setItem('avk_ladder2_simple',JSON.stringify(best))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9 ]/gi,'').replace(/\s+/g,' ').trim()}
function speak(text){try{if(window.parent!==window&&typeof window.parent.speak==='function'){window.parent.speak(text);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function menu(){const p=n=>best[n]||0;app.innerHTML='<div class="card"><h2>8 ступеней к перефразу</h2><p class="muted">Слышим опоры → понимаем смысл → узнаём ту же мысль в другой фразе. 从声音到句意。</p></div><div class="grid">'+titles.map((t,k)=>'<div class="tile" onclick="intro('+(k+1)+')"><span class="badge">Ступень '+(k+1)+'</span><h3>'+t+'</h3><div class="bar"><i style="width:'+p(k+1)+'%"></i></div><div class="muted">'+(p(k+1)?'лучший результат '+p(k+1)+'%':'15 заданий')+'</div></div>').join('')+'</div>'}
function head(n,i,res){return '<div class="top"><button onclick="menu()">← Ступени</button><h2>'+n+'. '+titles[n-1]+'</h2><div class="dots">'+Array.from({length:15},(_,k)=>'<i class="'+(k===i?'now':k<i?(res[k]?'ok':'bad'):'')+'"></i>').join('')+'</div></div>'}
function intro(n){if(n===8)return exam();app.innerHTML='<div class="card">'+head(n,0,[])+'<p class="muted">示范 · сначала посмотрите пример</p><div class="flow">🔊 слушай　→　👆 выбирай или пиши　→　✅ проверь</div><p>В этой ступени — 15 коротких заданий. После каждого ответа вы увидите объяснение.</p><button class="pri" onclick="run('+n+')">Начать · 开始 →</button></div>'}
function choices(correct,wrong){return [correct].concat(wrong).sort(()=>Math.random()-.5)}
function run(n){let i=0,res=[];function draw(){if(i===15)return finish();const x=items[i],correct=n===1?x[1]:n===2?x[2]:n===4?x[4]:n===5?simple(x[4]):x[5];const wrong=n===1?['автобус','дорога']:n===2?['есть прямое сообщение','через три дня']:n===4?['Это вопрос о работе.','Это совсем другое место.']:n===5?['совсем недорого','знают все']:['Смысл изменён.','Это не ответ на сообщение.'];let task=n===3?'<p>Напишите услышанную фразу.</p><input id="answer" placeholder="Введите фразу"><div class="row"><button class="pri" id="check">Проверить</button></div>':'<p>'+({1:'Выберите услышанное слово.',2:'Выберите услышанную смысловую группу.',4:'Выберите простое объяснение.',5:'Выберите равный по смыслу фрагмент.',6:'Выберите фразу с тем же смыслом.',7:'Выберите вариант, который сохраняет смысл.'}[n])+'</p><div class="opts">'+choices(correct,wrong).map(v=>'<button data-v="'+esc(v)+'">'+esc(v)+'</button>').join('')+'</div>';app.innerHTML='<div class="card">'+head(n,i,res)+'<div class="row"><button class="pri" id="play">🔊 Слушать</button><button id="slow">🐢 Медленно</button></div>'+task+'<div id="feedback"></div></div>';document.getElementById('play').onclick=()=>speak(n===3||n===5?x[3]:x[0]);document.getElementById('slow').onclick=()=>speak(n===3||n===5?x[3]:x[0]);function answer(ok){res.push(ok);document.querySelectorAll('[data-v]').forEach(b=>{b.disabled=true;if(norm(b.dataset.v)===norm(correct))b.className='ok'});document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'✅ Верно! · 对了':'Правильный ответ: '+esc(correct))+'<br><span class="muted">'+esc(x[5])+'</span></div><p><button class="pri" id="next">'+(i===14?'Готово · 完成':'Дальше · 下一个 →')+'</button></p>';document.getElementById('next').onclick=()=>{i++;draw()}}if(n===3)document.getElementById('check').onclick=()=>answer(norm(document.getElementById('answer').value)===norm(x[3]));else document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>answer(norm(b.dataset.v)===norm(correct)))}function finish(){const score=Math.round(100*res.filter(Boolean).length/15);best[n]=Math.max(best[n]||0,score);save();app.innerHTML='<div class="card"><h2>Результат: '+score+'%</h2><div class="feedback '+(score>=70?'ok':'bad')+'">'+(score>=70?'Ступень пройдена! · 已完成':'Для зачёта нужно 70%. Попробуйте ещё раз.')+'</div><p><button onclick="run('+n+')">↻ Ещё раз</button> <button class="pri" onclick="menu()">К ступеням</button></p></div>'}draw()}
function simple(s){return s.replace('очень дорого','слишком дорого').replace('До цирка нужно ехать с пересадкой','нужна пересадка').replace('Утром и вечером удобнее метро','утром и вечером').replace('Гостиница недавно появилась и пока не популярна','знают немногие').replace('Говорящий предлагает ехать автобусом','ехать автобусом').replace('Завтра в автобусе будет тесно','тесно').replace('Автобус едет быстрее трамвая','автобус быстрее').replace('Этот транспорт популярен','транспорт популярный').replace('Говорящий шутит о больших деньгах','много денег').replace('Человек спрашивает, как пройти на почту','как пройти на почту').replace('До центра нужно ехать на метро','ехать в центр').replace('Человек приехал недавно','совсем недавно').replace('Гостиницу не видно с улицы: она внутри двора','внутри двора').replace('Москва нравится всем, кто туда приезжает','город нравится')}
function exam(){if(window.parent!==window&&window.parent.__AVK_EMB){window.parent.__AVK_EMB.close();setTimeout(()=>window.parent.modPara(),0)}else location.href='index.html?para=1'}
window.openLad=menu;menu();
</script></body></html>
